name: Watch Claude Code Docs

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  check:
    name: Check for Claude Code doc changes
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch release notes and hash content
        id: fetch
        run: |
          # Hash the raw changelog, not the docs site. The old
          # docs.anthropic.com/en/release-notes/claude-code URL now redirects to
          # GitHub's rendered blob page, whose HTML changes on every request —
          # hashing it produces a false positive every run.
          curl -sL "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md" \
            -H "User-Agent: Mozilla/5.0 (compatible; template-docs-watcher/1.0)" \
            -o /tmp/changelog.md
          HASH=$(sha256sum /tmp/changelog.md | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Compare to baseline
        id: compare
        run: |
          BASELINE=$(cat .claude/docs-baseline.hash 2>/dev/null | tr -d '[:space:]' || echo "")
          LATEST="${{ steps.fetch.outputs.hash }}"
          if [ "$BASELINE" != "$LATEST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if docs changed
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          LATEST_HASH: ${{ steps.fetch.outputs.hash }}
        with:
          script: |
            // Skip if there is already an open review issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['claude-docs-update'],
              state: 'open',
            });
            if (existing.data.length > 0) {
              console.log('Open review issue already exists — skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Claude Code release notes changed — review template',
              labels: ['claude-docs-update'],
              body: [
                '## Claude Code docs have been updated',
                '',
                'The [Claude Code changelog](https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md) changed since the last baseline was recorded.',
                '',
                '### What to check',
                '',
                '- New features or settings not yet reflected in `docs/concepts.md`',
                '- New hook events, tool types, or permission patterns',
                '- Deprecated features the template should stop recommending',
                '- Updated defaults or best practices to adopt',
                '- Security or permission changes',
                '',
                '### How to review',
                '',
                'Open a Claude Code session in this repo and run:',
                '',
                '```',
                '/sync-template',
                '```',
                '',
                'The skill will fetch the changelog, compare it against the template files, and guide you through applying updates.',
                '',
                '### New baseline hash',
                '',
                'When the template has been updated, write this value to `.claude/docs-baseline.hash`',
                '(single line, no trailing whitespace) and commit it, then close this issue:',
                '',
                '```',
                process.env.LATEST_HASH,
                '```',
                '',
                'The hash is published here because fetching it locally requires `curl`, which the',
                'template denies inside a Claude session.',
              ].join('\n'),
            });
